spring.application.name=hoaxify-ws

# ws/.env dosyasındaki DB_PASSWORD, JWT_SECRET gibi değerler buradan okunur (bkz. .env.example)
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Database (PostgreSQL, docker-compose.yml ile ayağa kalkar) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/hoaxify}
spring.datasource.username=${DB_USERNAME:hoaxify}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
# Lazy ilişkiler sadece servis katmanındaki transaction içinde okunur; view'a kadar session açık tutulmaz
spring.jpa.open-in-view=false
# Lazy koleksiyonlar (ör. Hoax.tags) tek tek değil 20'şerli IN sorgusuyla yüklenir -> N+1 problemini azaltır
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# db/functions.sql (PostgreSQL fonksiyonları), Hibernate tabloları oluşturduktan sonra çalıştırılır
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/functions.sql
spring.sql.init.separator=;;

# --- i18n: Accept-Language başlığına göre messages_tr.properties / messages.properties ---
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

spring.data.web.pageable.max-page-size=50

# --- Mail (sadece dev dışındaki profillerde SmtpEmailServiceImpl tarafından kullanılır) ---
spring.mail.host=${MAIL_HOST:smtp.ethereal.email}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Uygulamaya özel ayarlar (HoaxifyProperties) ---
hoaxify.client.host=http://localhost:5173
hoaxify.email.from=noreply@my-app.com
# basic | jwt | opaque
hoaxify.token-type=opaque
hoaxify.jwt.secret=${JWT_SECRET:}
hoaxify.jwt.validity=24h
hoaxify.storage.root=uploads
hoaxify.storage.profile=profile

springdoc.swagger-ui.path=/swagger-ui.html

#---
spring.config.activate.on-profile=dev
hoaxify.storage.root=uploads-dev
logging.level.com.hoaxify.ws=DEBUG
# SQL sorgularını görmek için açabilirsin:
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
# Security filtre zincirini debug etmek için:
# logging.level.org.springframework.security=DEBUG

#---
spring.config.activate.on-profile=production
hoaxify.client.host=http://hoaxify.com
spring.jpa.hibernate.ddl-auto=validate
