plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.google.protobuf' version '0.9.5' apply false
}

allprojects {
    group = 'com.hoaxify'
    version = '0.0.1'

    repositories {
        mavenCentral()
    }
}

// Her modüle ortak ayarlar. Spring Boot plugin'i burada DEĞİL, sadece çalıştırılabilir servislerde uygulanır;
// common / common-web / grpc-contract düz kütüphane (jar) olarak kalır.
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply from: "${rootDir}/dependencies.gradle"

    java {
        sourceCompatibility = JavaVersion.toVersion(versions.java)
        targetCompatibility = JavaVersion.toVersion(versions.java)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = versions.java
        // @PathVariable / @RequestParam isimlerini parametre adından okuyabilmek için
        options.compilerArgs << '-parameters'
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${versions.springBoot}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${versions.springCloudBom}"
            mavenBom "org.springframework.grpc:spring-grpc-dependencies:${versions.springGrpc}"
        }
    }

    dependencies {
        compileOnly libs.lombok
        annotationProcessor libs.lombok
        testCompileOnly libs.lombok
        testAnnotationProcessor libs.lombok

        testImplementation libs.springBootStarterTest
        testImplementation libs.easyRandom
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        jvmArgs '-XX:+EnableDynamicAgentLoading', '-Xshare:off'
        testLogging { events 'failed'; exceptionFormat 'full' }
    }
}
