// Tüm sürümler ve kütüphane isimleri tek yerde (kursundaki yapı)
ext {
    versions = [
            java          : 21,
            springBoot    : '3.5.16',
            springCloudBom: '2025.0.3',
            springGrpc    : '0.12.0',
            protobuf      : '4.32.1',   // spring-grpc 0.12.0 BOM'unun kullandığı sürümle aynı olmalı
            grpc          : '1.76.0',
            lombok        : '1.18.48',
            springdoc     : '2.8.17',
            easyRandom    : '5.0.0',
    ]

    libs = [
            springBootStarterWeb       : 'org.springframework.boot:spring-boot-starter-web',
            springBootStarterWebflux   : 'org.springframework.boot:spring-boot-starter-webflux',
            springBootStarterValidation: 'org.springframework.boot:spring-boot-starter-validation',
            springBootStarterDataJpa   : 'org.springframework.boot:spring-boot-starter-data-jpa',
            springBootStarterDataRedis : 'org.springframework.boot:spring-boot-starter-data-redis',
            springBootStarterAmqp      : 'org.springframework.boot:spring-boot-starter-amqp',
            springBootStarterMail      : 'org.springframework.boot:spring-boot-starter-mail',
            springBootStarterActuator  : 'org.springframework.boot:spring-boot-starter-actuator',
            springBootStarterTest      : 'org.springframework.boot:spring-boot-starter-test',
            springBootConfigProcessor  : 'org.springframework.boot:spring-boot-configuration-processor',
            springCloudConfigServer    : 'org.springframework.cloud:spring-cloud-config-server',
            springCloudStarterConfig   : 'org.springframework.cloud:spring-cloud-starter-config',
            springCloudOpenFeign       : 'org.springframework.cloud:spring-cloud-starter-openfeign',
            springCloudGateway         : 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux',
            springGrpcServer           : 'org.springframework.grpc:spring-grpc-server-spring-boot-starter',
            springGrpcClient           : 'org.springframework.grpc:spring-grpc-client-spring-boot-starter',
            grpcProtobuf               : 'io.grpc:grpc-protobuf',
            grpcStub                   : 'io.grpc:grpc-stub',
            grpcInProcess              : 'io.grpc:grpc-inprocess',
            springSecurityCrypto       : 'org.springframework.security:spring-security-crypto',
            postgresql                 : 'org.postgresql:postgresql',
            lombok                     : "org.projectlombok:lombok:${versions.lombok}",
            springdoc                  : "org.springdoc:springdoc-openapi-starter-webmvc-ui:${versions.springdoc}",
            easyRandom                 : "org.jeasy:easy-random-core:${versions.easyRandom}",
            rabbitTest                 : 'org.springframework.amqp:spring-rabbit-test',
    ]
}
